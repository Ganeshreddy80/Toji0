# ============================================================================
# Toji — pyproject.toml
# Python project metadata and tooling configuration
# ============================================================================

[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toji"
version = "0.1.0"
description = "Production-grade quantitative research platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Toji Core Team"},
]
keywords = ["quantitative", "research", "toji_platform", "agents", "analytics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "hypothesis>=6.100.0",
    "factory-boy>=3.3.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "black>=24.4.0",
    "isort>=5.13.0",
    "pre-commit>=3.7.0",
    "httpx>=0.27.0",
    "testcontainers>=4.4.0",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["toji_platform*", "backend*", "agents*", "analytics*", "memory*", "mcp*", "workflows*", "data*", "research*", "knowledge*", "intelligence*", "decision*", "orchestrators*", "market_gateway*", "universe*", "market_intelligence*"]

# ── Ruff (Linter + Formatter) ──────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 88
fix = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific rules
]
ignore = [
    "S101",   # allow assert in tests
    "B008",   # allow function calls in default args (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "T20"]
"scripts/**/*.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["toji", "toji_platform", "backend", "agents", "analytics", "memory", "mcp", "data", "research", "knowledge", "intelligence", "decision", "orchestrators", "universe", "market_intelligence"]

# ── Black (Formatter) ─────────────────────────────────────────────────────
[tool.black]
target-version = ["py311"]
line-length = 88

# ── isort ──────────────────────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["toji", "toji_platform", "backend", "agents", "analytics", "memory", "mcp", "data", "research", "knowledge", "intelligence", "decision", "orchestrators", "universe", "market_intelligence"]

# ── mypy (Type Checker) ───────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ── pytest ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests", "market_intelligence/tests", "execution_engine/tests", "confluence/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "e2e: marks end-to-end tests",
]

# ── Coverage ───────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["toji_platform", "backend", "agents", "analytics", "memory", "mcp", "workflows", "data", "research", "knowledge", "intelligence", "decision", "orchestrators", "universe"]
omit = ["tests/*", "scripts/*", "*/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
    "\\.\\.\\.",
]
