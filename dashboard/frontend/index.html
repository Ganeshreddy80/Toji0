<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toji Quant Research & Trading Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Babel & React via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(26, 28, 35, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #6c5ce7;
            --primary-glow: rgba(108, 92, 231, 0.4);
            --accent: #00cec9;
            --accent-glow: rgba(0, 206, 201, 0.3);
            --text-main: #f5f6fa;
            --text-muted: #a0a5b5;
            --success: #00b894;
            --warning: #fdcb6e;
            --danger: #d63031;
            --info: #0984e3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            background-image: radial-gradient(circle at 10% 20%, rgba(108, 92, 231, 0.15) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(0, 206, 201, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Glassmorphism scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        .container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 2rem;
            backdrop-filter: blur(12px);
            background: rgba(15, 17, 23, 0.7);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .logo-section h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #a29bfe, #00cec9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 0.5rem;
            list-style: none;
        }

        .nav-item {
            padding: 0.6rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid transparent;
        }

        .nav-item:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.04);
        }

        .nav-item.active {
            color: var(--text-main);
            background: rgba(108, 92, 231, 0.15);
            border-color: rgba(108, 92, 231, 0.3);
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.1);
        }

        .live-status {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(0, 184, 148, 0.1);
            border: 1px solid rgba(0, 184, 148, 0.25);
            padding: 0.5rem 0.9rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--success);
        }

        .live-status.disconnected {
            background: rgba(214, 48, 49, 0.1);
            border-color: rgba(214, 48, 49, 0.25);
            color: var(--danger);
        }

        .ping-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 184, 148, 0.5); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(0, 184, 148, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 184, 148, 0); }
        }

        /* Main Workspace */
        main {
            flex: 1;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* Grid Layouts */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        /* Glassmorphism Cards */
        .card {
            backdrop-filter: blur(16px);
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: transparent;
            transition: background 0.3s;
        }

        .card.primary::before { background: var(--primary); }
        .card.accent::before { background: var(--accent); }
        .card.success::before { background: var(--success); }
        .card.warning::before { background: var(--warning); }
        .card.danger::before { background: var(--danger); }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.6rem;
        }

        .card-title i {
            color: var(--primary);
        }

        /* Subsystem Health Badge styles */
        .health-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 0.8rem;
        }

        .health-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0.8rem;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            text-align: center;
            gap: 0.4rem;
        }

        .health-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            text-transform: uppercase;
        }

        .status-healthy { background: rgba(0, 184, 148, 0.15); color: var(--success); border: 1px solid rgba(0, 184, 148, 0.3); }
        .status-initializing { background: rgba(9, 132, 227, 0.15); color: var(--info); border: 1px solid rgba(9, 132, 227, 0.3); }
        .status-warning { background: rgba(253, 203, 110, 0.15); color: var(--warning); border: 1px solid rgba(253, 203, 110, 0.3); }
        .status-error { background: rgba(214, 48, 49, 0.15); color: var(--danger); border: 1px solid rgba(214, 48, 49, 0.3); }
        .status-offline { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid var(--border-color); }

        /* Metric values */
        .metric-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
        }

        .metric-label {
            color: var(--text-muted);
        }

        .metric-value {
            font-weight: 600;
            font-family: 'Space Grotesk', sans-serif;
        }

        .metric-value.highlight {
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* Log console */
        .log-console {
            background: #0f1015;
            border-radius: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            padding: 1rem;
            height: 250px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .log-entry {
            line-height: 1.4;
            color: #dcdde1;
        }

        .log-entry.info { color: #00cec9; }
        .log-entry.warn { color: #fbc531; }
        .log-entry.error { color: #e84118; }

        /* Event Timeline */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .timeline-item {
            display: flex;
            gap: 1rem;
            border-left: 2px solid var(--primary);
            padding-left: 1rem;
            margin-left: 0.5rem;
            position: relative;
        }

        .timeline-item::after {
            content: '';
            position: absolute;
            left: -5px;
            top: 2px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .timeline-content {
            flex: 1;
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.8rem;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
        }

        .timeline-time {
            color: var(--text-muted);
        }

        .timeline-subsystem {
            font-weight: 700;
            color: var(--accent);
        }

        /* Filter bar */
        .filter-bar {
            display: flex;
            gap: 1rem;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
        }

        .filter-select {
            background: #1e2029;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-family: inherit;
            outline: none;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
            background: rgba(15, 17, 23, 0.5);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // WebSocket connections manager helper
        function useWebSocket(channel, onMessage) {
            const [connected, setConnected] = useState(false);
            const ws = useRef(null);

            useEffect(() => {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const host = window.location.host || 'localhost:8000';
                const wsUrl = `${protocol}//${host}/ws/${channel}`;
                
                ws.current = new WebSocket(wsUrl);

                ws.current.onopen = () => {
                    setConnected(true);
                    logger(`Connected to WebSocket channel: ${channel}`, 'info');
                };

                ws.current.onmessage = (event) => {
                    try {
                        const parsed = JSON.parse(event.data);
                        onMessage(parsed);
                    } catch (e) {
                        logger(`Failed to parse ws data: ${event.data}`, 'warn');
                    }
                };

                ws.current.onclose = () => {
                    setConnected(false);
                    logger(`Disconnected from WebSocket channel: ${channel}`, 'warn');
                    // Attempt reconnect in 5s
                    setTimeout(() => {}, 5000);
                };

                return () => {
                    if (ws.current) ws.current.close();
                };
            }, [channel]);

            return connected;
        }

        // Global Logger timeline buffer
        let logBuffer = [];
        let onLogAdded = null;
        function logger(msg, severity = 'info') {
            const now = new Date();
            const timestamp = now.toLocaleTimeString() + '.' + String(now.getMilliseconds()).padStart(3, '0');
            const newLog = { timestamp, message: msg, severity };
            logBuffer.push(newLog);
            if (logBuffer.length > 500) logBuffer.shift();
            if (onLogAdded) onLogAdded(newLog);
        }

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [health, setHealth] = useState({});
            const [snapshots, setSnapshots] = useState([]);
            const [logs, setLogs] = useState([]);
            const [events, setEvents] = useState([]);
            const [selectedSymbol, setSelectedSymbol] = useState('');
            const [selectedTimeframe, setSelectedTimeframe] = useState('');
            const [execAnalytics, setExecAnalytics] = useState(null);
            const [execAudit, setExecAudit] = useState([]);
            const [execCapabilities, setExecCapabilities] = useState(null);
            const [portfolioData, setPortfolioData] = useState(null);
            const [portfolioPositions, setPortfolioPositions] = useState({ open: [], closed: [] });
            const [platformStatus, setPlatformStatus] = useState(null);
            const [platformHeartbeats, setPlatformHeartbeats] = useState({});
            const [platformModules, setPlatformModules] = useState([]);
            const [platformEvents, setPlatformEvents] = useState([]);

            // Sprint 7 Risk states
            const [riskStatus, setRiskStatus] = useState([]);
            const [riskBreakers, setRiskBreakers] = useState({});
            const [riskOverrideActive, setRiskOverrideActive] = useState(false);
            const [emergencyStopActive, setEmergencyStopActive] = useState(false);

            // Sprint 8 OMS & EMS states
            const [omsIntents, setOmsIntents] = useState([]);
            const [omsState, setOmsState] = useState(null);
            const [brokerStatuses, setBrokerStatuses] = useState([]);
            const [emsExecutions, setEmsExecutions] = useState([]);

            const triggerRecovery = async () => {
                try {
                    const res = await fetch('/api/v1/orders/recovery', { method: 'POST' });
                    const data = await res.json();
                    if (data.status === 'completed') {
                        logger('OMS Crash Recovery Reconciliation completed.', 'info');
                        // Refresh data
                        fetchInitialData();
                    } else {
                        logger('Recovery trigger failed: ' + data.message, 'error');
                    }
                } catch (err) {
                    logger('Error triggering recovery: ' + err.message, 'error');
                }
            };

            const triggerKillswitch = async () => {
                try {
                    const res = await fetch('/api/v1/risk/killswitch', { method: 'POST' });
                    const data = await res.json();
                    if (data.status === 'triggered') {
                        setEmergencyStopActive(true);
                        logger('Emergency manual killswitch activated successfully.', 'warn');
                    } else {
                        logger('Failed to trigger killswitch: ' + data.message, 'error');
                    }
                } catch (err) {
                    logger('Error triggering killswitch: ' + err.message, 'error');
                }
            };

            const toggleOverride = async (enable) => {
                try {
                    const res = await fetch(`/api/v1/risk/override?enable=${enable}`, { method: 'POST' });
                    const data = await res.json();
                    if (data.status === 'configured') {
                        setRiskOverrideActive(data.override_active);
                        logger('Risk override mode set to ' + data.override_active, 'warn');
                    } else {
                        logger('Failed to set risk override: ' + data.message, 'error');
                    }
                } catch (err) {
                    logger('Error setting risk override: ' + err.message, 'error');
                }
            };

            // Keep reference to logs buffer
            useEffect(() => {
                setLogs([...logBuffer]);
                onLogAdded = (newLog) => {
                    setLogs((prev) => [...prev, newLog].slice(-500));
                };
                return () => { onLogAdded = null; };
            }, []);

            // 1. Fetch initial REST API states
            const fetchInitialData = async () => {
                try {
                    // Fetch health
                    const healthRes = await fetch('/health');
                    const healthData = await healthRes.json();
                    setHealth(healthData);

                    // Fetch snapshots
                    const snapRes = await fetch('/dashboard');
                    const snapData = await snapRes.json();
                    setSnapshots(snapData);

                    // Fetch events history
                    const eventsRes = await fetch('/events');
                    const eventsData = await eventsRes.json();
                    setEvents(eventsData);

                    // Fetch execution analytics
                    try {
                        const analyticsRes = await fetch('/executions/analytics');
                        const analyticsData = await analyticsRes.json();
                        setExecAnalytics(analyticsData);
                    } catch (err) {}

                    // Fetch execution audit
                    try {
                        const auditRes = await fetch('/executions/audit');
                        const auditData = await auditRes.json();
                        setExecAudit(auditData);
                    } catch (err) {}

                    // Fetch broker capabilities
                    try {
                        const capRes = await fetch('/executions/capabilities');
                        const capData = await capRes.json();
                        setExecCapabilities(capData);
                    } catch (err) {}

                    // Fetch portfolio metrics
                    try {
                        const portMetricsRes = await fetch('/portfolio/metrics');
                        const portMetricsData = await portMetricsRes.json();
                        setPortfolioData(portMetricsData);
                    } catch (err) {}

                    // Fetch portfolio positions
                    try {
                        const portPosRes = await fetch('/portfolio/positions');
                        const portPosData = await portPosRes.json();
                        setPortfolioPositions(portPosData);
                    } catch (err) {}

                    // Fetch platform status
                    try {
                        const statusRes = await fetch('/platform/status');
                        const statusData = await statusRes.json();
                        setPlatformStatus(statusData);
                    } catch (err) {}

                    // Fetch platform heartbeats
                    try {
                        const hbRes = await fetch('/platform/heartbeat');
                        const hbData = await hbRes.json();
                        setPlatformHeartbeats(hbData);
                    } catch (err) {}

                    // Fetch platform modules
                    try {
                        const modRes = await fetch('/platform/modules');
                        const modData = await modRes.json();
                        setPlatformModules(modData);
                    } catch (err) {}

                    // Fetch platform events
                    try {
                        const evRes = await fetch('/platform/events');
                        const evData = await evRes.json();
                        setPlatformEvents(evData);
                    } catch (err) {}

                    // Fetch Sprint 7 Risk states
                    try {
                        const rStatusRes = await fetch('/api/v1/risk/status');
                        const rStatusData = await rStatusRes.json();
                        setRiskStatus(rStatusData);

                        // Align local stop/override flags with active state config
                        if (rStatusData && rStatusData.length > 0) {
                            const sampleConfig = rStatusData[0].states ? Object.values(rStatusData[0].states)[0].config : null;
                            if (sampleConfig) {
                                setEmergencyStopActive(sampleConfig.emergency_stop || sampleConfig.manual_kill_switch);
                                setRiskOverrideActive(sampleConfig.risk_override);
                            }
                        }
                    } catch (err) {}

                    // Fetch Sprint 7 Circuit breakers status
                    try {
                        const rBreakersRes = await fetch('/api/v1/risk/breakers');
                        const rBreakersData = await rBreakersRes.json();
                        setRiskBreakers(rBreakersData);
                    } catch (err) {}

                    // Fetch Sprint 8 OMS & EMS states
                    try {
                        const intentsRes = await fetch('/api/v1/orders/intents');
                        const intentsData = await intentsRes.json();
                        setOmsIntents(intentsData);
                    } catch (err) {}

                    try {
                        const omsStateRes = await fetch('/api/v1/orders/oms/state');
                        const omsStateData = await omsStateRes.json();
                        setOmsState(omsStateData);
                    } catch (err) {}

                    try {
                        const brokersRes = await fetch('/api/v1/orders/brokers');
                        const brokersData = await brokersRes.json();
                        setBrokerStatuses(brokersData);
                    } catch (err) {}

                    try {
                        const execsRes = await fetch('/api/v1/orders/executions');
                        const execsData = await execsRes.json();
                        setEmsExecutions(execsData);
                    } catch (err) {}
                    
                    logger('Successfully loaded state data from REST API.', 'info');
                } catch (e) {
                    logger('REST API connection failed. Retrying in background...', 'error');
                }
            };

            useEffect(() => {
                fetchInitialData();
                const interval = setInterval(fetchInitialData, 10000);
                return () => clearInterval(interval);
            }, []);

            // 2. Wire WebSockets channel updates
            const systemConnected = useWebSocket('system', (snapshot) => {
                // Update or add snapshot
                setSnapshots((prev) => {
                    const idx = prev.findIndex(s => s.symbol === snapshot.symbol && s.timeframe === snapshot.timeframe);
                    if (idx >= 0) {
                        const newSnaps = [...prev];
                        newSnaps[idx] = snapshot;
                        return newSnaps;
                    } else {
                        return [...prev, snapshot];
                    }
                });
                
                // Keep health aligned
                if (snapshot.health_status) {
                    setHealth(snapshot.health_status);
                }
            });

            const logsConnected = useWebSocket('logs', (data) => {
                logger(data.message, data.severity || 'info');
            });

            // Filter tools
            const activeSymbols = Array.from(new Set(snapshots.map(s => s.symbol)));
            const activeTimeframes = Array.from(new Set(snapshots.map(s => s.timeframe)));

            const filteredSnapshots = snapshots.filter(s => {
                if (selectedSymbol && s.symbol !== selectedSymbol) return false;
                if (selectedTimeframe && s.timeframe !== selectedTimeframe) return false;
                return true;
            });

            const activeSnapshot = filteredSnapshots[0] || null;

            return (
                <div class="container">
                    <header>
                        <div class="logo-section">
                            <i class="fa-solid fa-cube fa-xl" style={{color: 'var(--accent)'}}></i>
                            <h1>TOJI observatory</h1>
                        </div>
                        <ul class="nav-links">
                            <li class={`nav-item ${activeTab === 'dashboard' ? 'active' : ''}`} onClick={() => setActiveTab('dashboard')}>
                                <i class="fa-solid fa-gauge"></i> Dashboard
                            </li>
                            <li class={`nav-item ${activeTab === 'market' ? 'active' : ''}`} onClick={() => setActiveTab('market')}>
                                <i class="fa-solid fa-chart-line"></i> Market
                            </li>
                            <li class={`nav-item ${activeTab === 'patterns' ? 'active' : ''}`} onClick={() => setActiveTab('patterns')}>
                                <i class="fa-solid fa-shapes"></i> Patterns
                            </li>
                            <li class={`nav-item ${activeTab === 'confluence' ? 'active' : ''}`} onClick={() => setActiveTab('confluence')}>
                                <i class="fa-solid fa-circle-nodes"></i> Confluence
                            </li>
                            <li class={`nav-item ${activeTab === 'strategy' ? 'active' : ''}`} onClick={() => setActiveTab('strategy')}>
                                <i class="fa-solid fa-brain"></i> Strategy
                            </li>
                            <li class={`nav-item ${activeTab === 'risk' ? 'active' : ''}`} onClick={() => setActiveTab('risk')}>
                                <i class="fa-solid fa-shield-halved"></i> Risk
                            </li>
                             <li class={`nav-item ${activeTab === 'position' ? 'active' : ''}`} onClick={() => setActiveTab('position')}>
                                 <i class="fa-solid fa-scale-balanced"></i> Sizing
                             </li>
                              <li class={`nav-item ${activeTab === 'execution' ? 'active' : ''}`} onClick={() => setActiveTab('execution')}>
                                  <i class="fa-solid fa-bolt"></i> Execution
                              </li>
                              <li class={`nav-item ${activeTab === 'portfolio' ? 'active' : ''}`} onClick={() => setActiveTab('portfolio')}>

                                                            <td style={{padding: '0.75rem'}}>{hb.queue_depth || 0}</td>
                                                            <td style={{padding: '0.75rem'}}>{hb.messages_processed || 0}</td>
                                                            <td style={{padding: '0.75rem'}}>{(hb.memory_usage || 0).toFixed(2)} MB</td>
                                                            <td style={{padding: '0.75rem'}}>
                                                                {hb.error_count > 0 ? (
                                                                    <span style={{
                                                                        padding: '0.2rem 0.5rem',
                                                                        borderRadius: '4px',
                                                                        fontSize: '0.75rem',
                                                                        fontWeight: 600,
                                                                        backgroundColor: 'rgba(231, 76, 60, 0.15)',
                                                                        color: '#e74c3c'
                                                                    }}>{hb.error_count}</span>
                                                                ) : (
                                                                    <span style={{color: 'var(--text-muted)'}}>0</span>
                                                                )}
                                                            </td>
                                                            <td style={{padding: '0.75rem'}}>{new Date(hb.last_update).toLocaleTimeString()}</td>
                                                        </tr>
                                                    ))
                                                ) : (
                                                    <tr>
                                                        <td colSpan="8" style={{padding: '1rem', textAlign: 'center', color: 'var(--text-muted)'}}>Waiting for heartbeat telemetry...</td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <div class="grid grid-2" style={{marginTop: '1.5rem'}}>
                                    <div class="card">
                                        <div class="card-title">
                                            <span><i class="fa-solid fa-network-wired"></i> Loaded Subsystems & Dependencies</span>
                                        </div>
                                        <div class="table-responsive">
                                            <table class="data-table">
                                                <thead>
                                                    <tr>
                                                        <th style={{padding: '0.75rem'}}>Subsystem Name</th>
                                                        <th style={{padding: '0.75rem'}}>Version</th>
                                                        <th style={{padding: '0.75rem'}}>Dependencies</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {platformModules.length > 0 ? (
                                                        platformModules.map((mod) => (
                                                            <tr key={mod.id}>
                                                                <td style={{padding: '0.75rem', fontWeight: 600}}>{mod.name} <span style={{fontSize: '0.75rem', color: 'var(--text-muted)'}}>({mod.id})</span></td>
                                                                <td style={{padding: '0.75rem'}}>{mod.version}</td>
                                                                <td style={{padding: '0.75rem'}}>
                                                                    {mod.dependencies.length > 0 ? (
                                                                        mod.dependencies.map(d => (
                                                                            <span key={d} style={{
                                                                                padding: '0.2rem 0.5rem',
                                                                                borderRadius: '4px',
                                                                                fontSize: '0.75rem',
                                                                                fontWeight: 600,
                                                                                backgroundColor: 'rgba(127, 140, 141, 0.15)',
                                                                                color: '#95a5a6',
                                                                                marginRight: '0.25rem',
                                                                                display: 'inline-block'
                                                                            }}>{d}</span>
                                                                        ))
                                                                    ) : (
                                                                        <span style={{color: 'var(--text-muted)', fontSize: '0.85rem'}}>None</span>
                                                                    )}
                                                                </td>
                                                            </tr>
                                                        ))
                                                    ) : (
                                                        <tr>
                                                            <td colSpan="3" style={{padding: '1rem', textAlign: 'center', color: 'var(--text-muted)'}}>No modules loaded.</td>
                                                        </tr>
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>

                                    <div class="card">
                                        <div class="card-title">
                                            <span><i class="fa-solid fa-clock-rotate-left"></i> Event Dispatch Latency Timeline (Last 100)</span>
                                        </div>
                                        <div style={{maxHeight: '400px', overflowY: 'auto', paddingRight: '0.5rem'}}>
                                            {platformEvents.length > 0 ? (
                                                platformEvents.map((evt, idx) => (
                                                    <div key={idx} style={{
                                                        borderBottom: '1px solid var(--border-color)',
                                                        padding: '0.5rem 0',
                                                        display: 'flex',
                                                        justifyContent: 'space-between',
                                                        alignItems: 'center'
                                                    }}>
                                                        <div>
                                                            <span style={{fontWeight: 600, fontSize: '0.85rem', color: 'var(--text-color)'}}>{evt.event_type}</span>
                                                            <div style={{fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '0.15rem'}}>
                                                                Source: {evt.source} | Correlation: <span style={{fontFamily: 'monospace'}}>{evt.correlation_id || 'N/A'}</span>
                                                            </div>
                                                        </div>
                                                        <div style={{textAlign: 'right'}}>
                                                            <span style={{
                                                                fontSize: '0.85rem',
                                                                fontWeight: 600,
                                                                color: evt.processing_latency_ms > 10 ? '#e74c3c' : '#2ecc71'
                                                            }}>{evt.processing_latency_ms.toFixed(2)} ms</span>
                                                            <div style={{fontSize: '0.7rem', color: 'var(--text-muted)', marginTop: '0.15rem'}}>
                                                                {evt.timestamp.includes('T') ? evt.timestamp.split('T')[1].substring(0, 8) : evt.timestamp}
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))
                                            ) : (
                                                <p style={{padding: '1rem', textAlign: 'center', color: 'var(--text-muted)'}}>No events processed yet.</p>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </React.Fragment>
                        )}

                        {activeTab === 'logs' && (
                            <React.Fragment>
                                <div class="card">
                                    <div class="card-title">
                                        <span><i class="fa-solid fa-terminal"></i> Platform logs console</span>
                                    </div>
                                    <div class="log-console">
                                        {logs.map((log, idx) => (
                                            <div key={idx} class={`log-entry ${log.severity}`}>
                                                [{log.timestamp}] {log.message}
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div class="card" style={{marginTop: '1.5rem'}}>
                                    <div class="card-title">
                                        <span><i class="fa-solid fa-timeline"></i> Event dispatches timeline</span>
                                    </div>
                                    <div class="timeline">
                                        {events.map((e) => (
                                            <div key={e.event_id} class="timeline-item">
                                                <div class="timeline-content">
                                                    <div class="timeline-header">
                                                        <span class="timeline-subsystem">{e.subsystem}</span>
                                                        <span class="timeline-time">{new Date(e.timestamp).toLocaleTimeString()}</span>
                                                    </div>
                                                    <p style={{fontWeight: 600, fontSize: '0.9rem'}}>{e.event_name}</p>
                                                    <p style={{fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '0.2rem'}}>
                                                        Target: {e.symbol}/{e.timeframe} | Latency: {e.latency_ms.toFixed(1)}ms
                                                    </p>
                                                </div>
                                            </div>
                                        ))}
                                        {events.length === 0 && <p style={{color: 'var(--text-muted)'}}>No timeline events recorded yet.</p>}
                                    </div>
                                </div>
                            </React.Fragment>
                        )}
                    </main>

                    <footer>
                        &copy; 2026 Toji Trading System - Observability Platform. Built with React and FastAPI.
                    </footer>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        ReactDOM.createRoot(rootElement).render(<App />);
    </script>
</body>
</html>
